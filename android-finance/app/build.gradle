plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.eshtaylakov.finance'
    compileSdk 36

    defaultConfig {
        applicationId 'uz.eshtaylakov.finance'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '2.0-offline'
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('.signing/finance-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
        }
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.activity:activity:1.9.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}

tasks.register('bundleFinanceInterface', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'android-finance/build-web.mjs'
}
tasks.named('preBuild').configure { dependsOn 'bundleFinanceInterface' }
